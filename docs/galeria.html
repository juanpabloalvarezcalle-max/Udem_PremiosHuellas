<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galería del proyecto | Premios Huella 2026</title>
<link rel="icon" type="image/svg+xml" href="../imgs/iconoNavegador.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/style.css">
<link rel="stylesheet" href="../styles/galeria.css">
<script src="../scripts/galeria-datos.js" defer></script>
<script src="../scripts/galeria.js" defer></script>
</head>
<body class="galeria-pagina">

<!-- Iconos reutilizables (usan currentColor) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<!-- Círculo con X (cerrar), el mismo de las páginas de proyecto -->
<symbol id="icono-cerrar" viewBox="0 0 56 56">
<circle cx="28" cy="28" r="22" fill="none" stroke="currentColor" stroke-width="3"/>
<path d="M20 20l16 16M36 20L20 36" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
</symbol>
<!-- Flecha larga hacia la derecha -->
<symbol id="icono-flecha-larga" viewBox="0 0 56 32">
<path d="M4 16h46M37 4l13 12-13 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
</svg>

<!-- Escenario: fondo desenfocado con la misma foto + la foto completa (sin recortes) -->
<div class="galeria-escenario" id="escenario">
<div class="fondo">
<div class="capa" id="fondoA"></div>
<div class="capa" id="fondoB"></div>
</div>
<div class="foto-marco" id="marco" role="img" aria-live="polite">
<div class="capa" id="fotoA"></div>
<div class="capa" id="fotoB"></div>
</div>
<div class="escenario__velo"></div>
</div>

<!-- Interfaz sobre el escenario -->
<div class="galeria-ui">

<header class="barra-superior">
<div class="marca">
<a class="cerrar" id="cerrar" href="../index.html" aria-label="Cerrar la galería y volver al proyecto">
<svg aria-hidden="true"><use href="#icono-cerrar"/></svg>
</a>
<h1 class="titulo" id="titulo">Galería</h1>
<span class="etiqueta-categoria" id="categoria"></span>
</div>

<nav class="acciones">
<a class="pildora pildora--original" id="original" href="#" target="_blank" rel="noopener noreferrer" hidden>
<span class="pildora__texto" id="originalTexto">Abrir original</span>
<svg aria-hidden="true"><use href="#icono-flecha-larga"/></svg>
</a>
<button class="pildora pildora--icono" id="btnAutoplay" type="button" aria-pressed="true" title="Pausar / reanudar el pase automático (Espacio)">
<svg class="icono icono-pausa" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
<svg class="icono icono-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M8 5v14l11-7z"/></svg>
<span class="pildora__texto">Automático</span>
</button>
<button class="circulo" id="btnPantalla" type="button" title="Pantalla completa (F)" aria-label="Pantalla completa">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
</button>
</nav>
</header>

<div class="zona-inferior">

<div class="contador">
<div class="contador__cifras" aria-live="polite">
<span class="contador__actual" id="actual">01</span>
<span class="contador__barra">/</span>
<span class="contador__total" id="total">01</span>
</div>
<div class="contador__rotulo">Galería del proyecto</div>
</div>

<div class="muelle">
<div class="muelle__cabecera">
<div class="progreso" aria-hidden="true"><div class="progreso__relleno" id="progreso"></div></div>
<div class="flechas">
<button class="flecha" id="btnAnterior" type="button" aria-label="Foto anterior" title="Anterior (←)">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<button class="flecha" id="btnSiguiente" type="button" aria-label="Foto siguiente" title="Siguiente (→)">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
</button>
</div>
</div>

<div class="pista-miniaturas" id="pistaMiniaturas">
<div class="miniaturas" id="miniaturas"><!-- Las miniaturas las crea scripts/galeria.js --></div>
</div>
</div>

</div>

<footer class="pie">
<div class="atajos">Navega con <kbd>←</kbd> <kbd>→</kbd> · <kbd>Espacio</kbd> pausa · Desliza las fotos</div>
<div class="puntos" id="puntos"><!-- Los crea scripts/galeria.js --></div>
</footer>

</div>

<noscript><p style="position:fixed;inset:auto 1rem 1rem;color:#F6ECDB">Esta galería necesita JavaScript.</p></noscript>
</body>
</html>
